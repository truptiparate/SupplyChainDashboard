(2022/2025); Comtrade — Ryanair Labs, myRyanair, Brainer. Umbrex/Latterly profiles."],"_sheet_name":"FIB-004"},{"id":"FIB-005","name":"Maersk NotPetya Cyberattack (2017) — global shipping infrastructure wiped","industry":"Logistics & Transportation / Maritime Shipping / Cybersecurity","brand_group":"A.P. Møller-Maersk — world's largest container shipping line","scale":"Handles ~20% of global maritime container trade; 130 countries; 600+ offices; 76 container terminals; 45,000 employees affected","normal_flow_nodes":[{"label":"Node 1 — IT infrastructure (domain controllers)","description":"Authentication backbone of the entire global network. ALL wiped by NotPetya within hours — except one in Ghana saved by a power cut."},{"label":"Node 2 — Terminal Operating Systems (76 ports)","description":"Systems orchestrating container movements, loading plans, gate operations at 76 terminals. All went dark."},{"label":"Node 3 — Booking & cargo-tracking systems","description":"Customer-facing freight booking and shipment tracking. Completely unavailable."},{"label":"Node 4 — Internal communication (email/phones)","description":"Email and internal phone systems rendered useless by the attack."},{"label":"Node 5 — Ship loading management","description":"Weight-balance calculation systems for safe container loading. Offline."},{"label":"Node 6 — Port operations (77 countries)","description":"Physical port facilities across 76 terminals in 130 countries. Forced to halt or operate manually."},{"label":"Node7 — Customer supply chains","description":"Every importer/exporter using Maersk services. Lost visibility of cargo, delivery dates, documentation."}],"normal_flow_steps":[{"step":1,"process":"Customer books container shipment via Maersk digital platforms","node":"Booking system / customer"},{"step":2,"process":"Cargo assigned to vessel; loading plan calculated by weight-balance system","node":"Terminal Operating System"},{"step":3,"process":"Container arrives at port; gate systems process entry","node":"Port gate / TOS"},{"step":4,"process":"Container loaded onto ship per precise loading plan","node":"Ship loading management"},{"step":5,"process":"Vessel departs; cargo tracked in real time","node":"Tracking systems"},{"step":6,"process":"Destination port receives vessel; TOS orchestrates unloading","node":"Destination terminal"},{"step":7,"process":"Cargo handed to customer / onward logistics","node":"Customer / haulier"},{"step":8,"process":null,"node":null},{"step":9,"process":null,"node":null},{"step":10,"process":null,"node":null},{"step":11,"process":null,"node":null},{"step":12,"process":null,"node":null},{"step":8,"process":null,"node":null}],"kpis":[{"label":"Cost","value":"Very High"},{"label":"Lead Time","value":"High"},{"label":"CO₂ Impact","value":"High (global shipping is a major CO₂ emitter)"},{"label":"Waste","value":"Medium"},{"label":"Customer Satisfaction","value":"High pre-attack (full digital service)"},{"label":"Risk","value":"High but unrecognised (average posture for sector in 2017)"},{"label":"Quality","value":"High (precision container logistics)"},{"label":"Sustainability","value":"Medium (efficiency of scale vs shipping emissions)"},{"label":"Circular Economy","value":"Low (not applicable to shipping logistics in this context)"}],"disruption":[{"label":"Trigger event","value":"27 June 2017: NotPetya wiper deployed via a compromised M.E.Doc software update. One infected computer in Odessa, Ukraine spread to Maersk's entire global network within hours."},{"label":"Root cause (proximate)","value":"Weak network segmentation allowed a single infection to propagate globally via EternalBlue + credential harvesting. All domain controllers wiped. All backups (also in-network) wiped."},{"label":"Root cause (structural)","value":"Three structural gaps: (1) no network segmentation; (2) no isolated offline backups; (3) unpatched Windows vulnerability (EternalBlue patch existed since March 2017 — 3 months before the attack); (4) no third-party software security assessment for M.E.Doc."},{"label":"Speed of destruction","value":"Within hours of the initial infection, the entire global IT estate was gone. 600+ offices, 76 terminals, 130 countries — all simultaneously."},{"label":"Affected nodes","value":"ALL nodes: domain controllers (wiped), TOS (76 ports offline), booking/tracking (unavailable), email/phones (dead), ship loading (halted), customer-facing systems (gone)."},{"label":"Financial impact","value":"~$250–300M (Maersk Q2 2017); ~$350M including recovery. Total NotPetya damages across all victims exceeded $10B."},{"label":"Effect on supply chain","value":"Global shipping halt: port facilities shut down worldwide, tens of thousands of truckloads turned away. Maersk maintained ~80% of volume manually during 10-day outage — only a ~20% volume drop. Without the Ghana backup, recovery would have taken months, not days."},{"label":"Comparator companies","value":"Merck (~$870M, Vaccine (Gardasil 9) supply disruption extended for months; Merck took ~18 months to replenish the borrowed CDC pediatric stockpile); FedEx/TNT (~$300M+, some permanent data loss admitted). Maersk's 10-day rebuild was relatively fast by comparison."}],"decision_blocks":[{"source":"Decision Analysis by the Company","decisions":[{"Decision No":"1","Description":"Immediate shutdown of all systems","Action":"Shut down entire IT estate to prevent further spread","Cost":"Low","Lead Time":"Fast","CO2 Impact":"Neutral","Risk":"Reduced (containment)","Quality":"Preserved","Customer satisfaction":"Prevented worse loss","Sustainability":"n/a","Circular Economy":"n/a","Best when":"When malware is still spreading — stop the bleeding first"},{"Decision No":2,"Description":"Manual operation continuity","Action":"Run 80% of volume via phone/WhatsApp/handwritten manifests","Cost":"Very Low (no systems)","Lead Time":"Sustained for 10 days","CO2 Impact":"Neutral","Risk":"Reduced (contained)","Quality":"Partial (~80%)","Customer satisfaction":"80% protected","Sustainability":"n/a","Circular Economy":"n/a","Best when":"When systems gone — human resilience is the backup"},{"Decision No":3,"Description":"Server emergency extraction","Action":"Physical transport Ghana→Nigeria→London to retrieve surviving domain controller","Cost":"Low","Lead Time":"Fast once identified","CO2 Impact":"Med (air travel)","Risk":"Reduced (enabler)","Quality":"Recovery enabled","Customer satisfaction":"Critical","Sustainability":"n/a","Circular Economy":"n/a","Best when":"When all other backups are gone — the accidental backup saves everything"},{"Decision No":4,"Description":"Emergency 10-day infrastructure rebuild","Action":"Reinstall 4,000 servers, 45,000 PCs, 2,500 apps — new infrastructure from scratch","Cost":"Very High (hardware + labour)","Lead Time":"10 days","CO2 Impact":"High (hardware)","Risk":"Reduced (restored)","Quality":"Restored","Customer satisfaction":"Restored","Sustainability":"n/a","Circular Economy":"n/a","Best when":"Backup available; emergency resources mobilised"},{"Decision No":5,"Description":"Network segmentation (post-crisis)","Action":"Segment network so a single infection cannot traverse globally","Cost":"High (capex + complexity)","Lead Time":"Months to build","CO2 Impact":"Neutral","Risk":"Reduced (structural)","Quality":"High","Customer satisfaction":"High","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"After lateral-movement attack reveals single flat network"},{"Decision No":6,"Description":"Geographically isolated offline backups","Action":"Mandate offline, geographically dispersed backups tested regularly","Cost":"Medium (ongoing)","Lead Time":"Months to build","CO2 Impact":"Low (storage)","Risk":"Reduced (structural)","Quality":"High","Customer satisfaction":"High","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Accident becomes a design principle"},{"Decision No":7,"Description":"Patch management discipline","Action":"Apply all critical patches within defined windows; EternalBlue was patchable 3 months before the attack","Cost":"Low-Med","Lead Time":"Fast (once process in place)","CO2 Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer satisfaction":"High","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Known exploitable vulnerabilities with available patches"},{"Decision No":8,"Description":"Third-party software security assessment","Action":"Security audit all vendor software before installation; M.E.Doc was unvetted","Cost":"Low-Med","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer satisfaction":"High","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Any third-party software installed on enterprise network"},{"Decision No":9,"Description":"Board-level cyber programme","Action":"Elevate cyber to board risk; IR playbooks; regular drills; competitive advantage target","Cost":"Medium (ongoing)","Lead Time":"Long-term","CO2 Impact":"Neutral","Risk":"Reduced (strategic)","Quality":"High","Customer satisfaction":"High","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"After a systemic shock proves average posture is insufficient"}]},{"source":"Decision Analysis  (Self Analysis)","decisions":[{"Decision No":"1","Description":"Zero-trust network architecture (pre-attack)","Action":"Segment all IT infrastructure so that no single compromised node can propagate laterally across the global network","Cost":"High","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"Before any major IT transformation or cloud migration; foundational for any 100k+ employee enterprise"},{"Decision No":2,"Description":"Air-gapped immutable backup protocol","Action":"Maintain offline, geographically dispersed backups with cryptographic integrity verification updated daily","Cost":"Low-Med","Lead Time":"Med
