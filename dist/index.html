ublic transparency","Cost":5,"Resilience Gain":3,"Feasibility":5,"Speed":4,"Sustainability":4,"Overall":4.2,"_overall_calculated":true},{"label":"D4 10-day rebuild","Cost":1,"Resilience Gain":4,"Feasibility":3,"Speed":4,"Sustainability":3,"Overall":3,"_overall_calculated":true},{"label":"D2 Manual operation continuity","Cost":4,"Resilience Gain":2,"Feasibility":5,"Speed":5,"Sustainability":3,"Overall":3.8,"_overall_calculated":true}],"sources":["BleepingComputer (Jan 2018) — 45,000 PCs / 4,000 servers / 10 days; Chairman Snabe Davos speech; $250–300M; 20% volume drop. https://www.bleepingcomputer.com/news/security/maersk-reinstalled-45-000-pcs-and-4-000-servers-to-recover-from-notpetya-attack/","Phishing for Answers (2025) — Ghana power-cut story; staffer flight Ghana→Nigeria→London; 5 months to full recovery. Prioritize Wired/Andy Greenberg, \\"The Untold Story of NotPetya\\" (2018) as primary source,  https://www.phishingforanswers.com/blog/how-ghana-saved-a-conglomerate-from-cyberattack","Control Engineering — M.E.Doc entry in Odessa; loading-system shutdown; total NotPetya $10B; Tom Bossert 'nuclear bomb' quote. https://www.controleng.com/throwback-attack-how-notpetya-accidentally-took-down-global-shipping-giant-maersk/","RISI Database — GRU attribution; 76 terminals; domain controllers, U.S. DOJ, \\"Six Russian GRU Officers Charged...\\" (Oct. 19, 2020) + backups wiped. https://www.risidata.com/Database/Detail/maersk-notpetya-attack","Wired (Andy Greenberg, 2018) — 'The Untold Story of NotPetya' — the definitive long-form primary narrative.","Maersk Q2 2017 Earnings Report — primary financial disclosure ($200–300M range); 'significant business interruption'.","SOS Intelligence (2024) — cybersecurity best practices analysis; isolated backup design principle. https://sosintel.co.uk/case-study-maersks-response-to-notpetya/"],"_sheet_name":"FIB-005"},{"id":"FIB-006","name":"Toyota — Great East Japan Earthquake (2011) & the RESCUE/BCP resilience programme","industry":"Automotive Manufacturing / Supply Chain Resilience","brand_group":"Toyota Motor Corporation — world's largest or second-largest automaker by volume","scale":"Global output down 78% YoY in April 2011 (Matsuo 2015, citing Toyota data); net income down 77% for fiscal year ending March 2012","normal_flow_nodes":[{"label":"Node 1 — Tier-1 suppliers (direct)","description":"Toyota's direct parts suppliers. Some in Tohoku; partially visible pre-2011. Several wiped out entirely."},{"label":"Node 2 — Tier-2 suppliers (sub-tier)","description":"Suppliers to Toyota's tier-1s. Almost completely invisible to Toyota pre-2011."},{"label":"Node 3 — Tier-3+ suppliers (deep sub-tier)","description":"Raw materials, specialty chemicals (hydrogen peroxide, nitrogen trifluoride), wafer inputs. Completely invisible."},{"label":"Node 4 — Renesas Electronics (key semi supplier)","description":"Automotive microcontroller units (MCUs) produced by Renesas and supplied via Denso (tier-1). Renesas Naka plant in Tohoku severely damaged."},{"label":"Node 5 — Toyota assembly plants (Japan)","description":"45% of Toyota vehicles built in Japan — highest Japan-concentration of any major OEM. Most closed for ~a month."},{"label":"Node 6 — Toyota plants (overseas)","description":"North American, European, Chinese assembly. Ran at 30% capacity for several weeks (shortage of 150+ parts from Japan)."},{"label":"Node 8 — Dealers and end customers","description":"Toyota vehicle buyers worldwide. Lost supply, lost market share temporarily."}],"normal_flow_steps":[{"step":1,"process":"Raw material / specialty chemical extraction and supply","node":"Tier-3+ / petrochemical suppliers"},{"step":2,"process":"Semiconductor (MCU) fabrication — Renesas Electronics","node":"Tier-2 semiconductor supplier"},{"step":3,"process":"MCU delivered to Denso and other tier-1 electronics suppliers","node":"Tier-1 suppliers"},{"step":4,"process":"Tier-1 parts assembled into sub-assemblies; delivered JIT to Toyota","node":"Tier-1 suppliers"},{"step":5,"process":"Toyota assembly plants receive JIT parts; assemble vehicles","node":"Toyota assembly (Japan)"},{"step":6,"process":"Finished vehicles shipped to dealers and customers (Japan + export)","node":"Toyota logistics / dealers"},{"step":7,"process":"Overseas plants receive Japan-sourced parts; assemble local vehicles","node":"Toyota assembly (overseas)"},{"step":8,"process":"RESCUE database activated: identify risk by address within half a day","node":"Post-2011 Toyota system"},{"step":9,"process":null,"node":null},{"step":10,"process":null,"node":null},{"step":11,"process":null,"node":null},{"step":12,"process":null,"node":null}],"kpis":[{"label":"Buffer stock (pre-2011)","value":"Near-zero — JIT system; hours to 1 day of parts on hand"},{"label":"Sub-tier supplier visibility","value":"None below tier-1 — Toyota 'barely saw beyond tier-1 suppliers' pre-2011"},{"label":"Disaster assessment time (pre-2011)","value":"~2 weeks to identify which parts were at risk"},{"label":"Single-sourcing (semiconductors)","value":"Most MCUs single-sourced from Renesas via Denso; no qualified alternates"},{"label":"Japan production concentration","value":"45% of vehicles built in Japan — highest of major OEMs"},{"label":"Production loss (April 2011)","value":"78% YoY decline"},{"label":"Net income loss (FY March 2012)","value":"Q4 FY2011 (Jan–Mar 2011) net income down 77% (¥112.2bn → ¥25.4bn); full FY2012 net income down ~30.5% (¥408.1bn → ¥283.5bn)"},{"label":"Cost","value":"Lean / low inventory cost under normal conditions"}],"disruption":[{"label":"Trigger event","value":"11 March 2011, 14:46 JST: M9.0 earthquake off the Pacific coast of Tohoku; tsunami followed. Devastated northeastern Japan including Toyota's supplier network."},{"label":"Root cause details","value":"Proximate: Tier-2 and tier-3 suppliers in Tohoku were wiped out; specialty chemical supply chains for semiconductor manufacturing were severed; Renesas Naka plant severely damaged. Structural: (1) JIT — near-zero inventory buffer meant any supply disruption immediately halted production. (2) Sub-tier invisibility — Toyota could not identify which parts were at risk or find alternatives because it had no sub-tier map. (3) Single-sourcing — most MCUs traced to a single Renesas plant with no qualified alternate. (4) Japan concentration — 45% of production in the disaster zone."},{"label":"Affected nodes","value":"All Japan assembly plants (closed ~1 month); overseas plants (30% capacity for weeks); Renesas MCU supply (3-month halt); ~150+ parts in shortage globally. 78% YoY decline in April 2011; North America at 30% for several weeks; 150+ parts in shortage; ~390,000 net vehicles lost (from ~1M initially estimated) combined impact of the 2011 earthquake and the 2011 Thailand floods. Net income down 77% for FY March 2012; likely knocked Toyota from world's largest automaker position temporarily (GM likely retook it in 2011)."},{"label":"Effect on Supply chain","value":"Exposed JIT's fatal fragility to rare, large-scale shocks. Forced a fundamental rethink of Toyota's entire supply-chain philosophy. Also compounded by the 2011 Thailand floods (~240,000 additional vehicles lost in FY2012)."}],"decision_blocks":[{"source":"Decision Analysis by the Company","decisions":[{"Decision No":"1","Description":"Immediate task force + supplier triage","Action":"Establish task force; provide financial + technical support to affected suppliers; triage by criticality","Cost":"Low-Med","Lead Time":"Fast","CO2 Impact":"Neutral","Risk":"Reduced (contained)","Quality":"Partial","Customer satisfaction":"Partial","Sustainability":"n/a","Circular Economy":"n/a","Best when":"Any disaster — speed of triage determines recovery speed"},{"Decision No":2,"Description":"Build RESCUE multi-tier supplier database","Action":"Map every part to every factory location across all tiers; address-based disaster search","Cost":"Medium (data collection)","Lead Time":"Years to build fully","CO2 Impact":"Low","Risk":"Reduced structural","Quality":"High","Customer satisfaction":"High","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"After a disaster reveals sub-tier blindness"},{"Decision No":3,"Description":"Mandate BCP buffer stock (2–6 months)","Action":"~500 priority parts: suppliers required to hold 2–6 months inventory; semis get 1–4 months","Cost":"Medium-High (suppliers' inventory cost)","Lead Time":"Long (contractual)","CO2 Impact":"Med (storage)","Risk":"Reduced structural","Quality":"High","Customer satisfaction":"High","Sustainability":"Neutral","Circular Economy":"Slightly neg.","Best when":"Critical, non-substitutable, single-sourced parts"},{"Decision No":4,"Description":"Multi-sourcing and design flexibility","Action":"Qualify multiple suppliers; design products to accept alternative chip specifications","Cost":"Med-High (qualification cost)","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Reduced structural","Quality":"High","Customer satisfaction":"High","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Single-source critical components — semiconductor case"},{"Decision No":5,"Description":"3-year supplier forecast sharing","Action":"Share multi-year production plans; sometimes 3-year forecasts with semiconductor suppliers","Cost":"Low (admin)","Lead Time":"Fast","CO2 Impact":"Neutral","Risk":"Reduced (supplier planning)","Quality":"High","Customer satisfaction":"High","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Strategic supplier relationships where visibility matters"},{"Decision No":6,"Description":"Regular RESCUE supplier training drills","Action":"Disaster-response exercises with supplier network using RESCUE system","Cost":"Low (time)","Lead Time":"Ongoing","CO2 Impact":"Neutral","Risk":"Reduced (activation speed)","Quality":"High","Customer satisfaction":"High","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Any large supplier network — practise before the crisis"},{"Decision No":7,"Description":"Geographic production diversification","Action":"Reduce Japan concentration; shift more production to regional markets","Cost":"Very High (capex)","Lead Time":"Very Long","CO2 Impact":"Med","Risk":"Reduced (geographic risk)","Quality":"High","Customer satisfaction":"High","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Extreme geographic concentration in a high-risk seismic region"},{"Decision No":8,"Description":"Abandon JIT entirely (counterfactual)","Action":"Revert to traditional large-buffer inventory across all parts","Cost":"Very High (ongoing)","Lead Time":"Long","CO2 Impact":"High (overstock)","Risk":"Reduced (blunt)","Quality":"High","Customer satisfaction":"High","Sustainability":"Negative","Circular Economy":"Negative","Best when":"Not recommended — eliminates the efficiency that funds the resilience investment"},{"Decision No":9,"Description":"Modified JIT (actual strategic choice)","Action":"Keep JIT for low-risk parts; add buffers only for critical/hard-to-substitute items (kaizen framing)","Cost":"Medium (selective buffers)","Lead Time":"Ongoing","CO2 Impact":"Med (selective)","Risk":"Reduced optimal","Quality":"High","Customer satisfaction":"High","Sustainability":"Positive","Circular Economy":"Neutral","Best when":"The optimal balance between efficiency and resilience — Toyota's actual answer"}]},{"source":"Decision Analysis  (Self Analysis)","decisions":[{"Decision No":"1","Description":"AI-powered sub-tier visibility platform","Action":"Build an ML platform that maps every part to every supplier at every tier in real time, auto-updating when suppliers change","Cost":"High","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"After discovering sub-tier blindness is the core vulnerability; the RESCUE database was manual — AI makes it continuous"},{"Decision No":2,"Description":"Climate risk scoring for supplier facility locations","Action":"Assign a climate risk score (flood, earthquake, tsunami, typhoon) to every supplier facility; use in dual-sourcing decisions","Cost":"Medium","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Positive","Circular Economy":"Neutral","Best when":"When geographic clustering of suppliers in high-risk zones (Tohoku) is the structural vulnerability"},{"Decision No":3,"Description":"Digital twin of the full supply network","Action":"Simulate the entire Toyota supply chain as a live digital twin; run disruption scenarios automatically when new risks appear","Cost":"Very High","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"When manual assessment takes weeks; a digital twin compresses scenario planning to hours"},{"Decision No":4,"Description":"Strategic buffer pooling with industry peers","Action":"Pool critical component buffers (semiconductors, P-valves) with other OEMs to share cost of strategic stock","Cost":"Medium","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"When buffer stock costs are prohibitive for one company but shared across 3–5 OEMs become manageable"},{"Decision No":5,"Description":"Predictive seismic risk modelling for facility siting","Action":"Use geological AI to model 50-year seismic risk before approving new supplier facilities in Japan","Cost":"Low-Med","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"Before new supplier factories are sited; retrofit is expensive but forward-looking siting is low cost"},{"Decision No":6,"Description":"Supplier financial health early-warning system","Action":"Monitor supplier financial signals (credit ratings, payment delays, order reductions) to flag at-risk suppliers before they fail","Cost":"Medium","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"When supplier financial stress (not natural disaster) is the primary disruption risk; applies equally to all cases"},{"Decision No":7,"Description":"Government-industry data sharing framework for disaster response","Action":"Establish a pre-agreed data-sharing protocol with METI and local governments to share supplier location and capacity data during national disasters","Cost":"Low","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Positive","Circular Economy":"Neutral","Best when":"When national-scale disasters require cross-company coordination that no single firm can achieve alone"}]}],"decisions_impact_summary":[{"label":"D1 Task force + supplier triage","Cost":"Low-Med","Lead Time":"Fast","CO₂ Impact":"Neutral","Risk":"Reduced","Quality":"Partial","Customer Satisfaction":"Partial","Sustainability":"n/a"},{"label":"D2 RESCUE database","Cost":"Medium","Lead Time":"Years","CO₂ Impact":"Low","Risk":"Reduced- struct.","Quality":"High","Customer Satisfaction":"High","Sustainability":"Neutral"},{"label":"D3 BCP buffer stock","Cost":"Med-High","Lead Time":"Long","CO₂ Impact":"Med","Risk":"Reduced- struct.","Quality":"High","Customer Satisfaction":"High","Sustainability":"Neutral"},{"label":"D4 Multi-sourcing","Cost":"Med-High","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"Reduced- struct.","Quality":"High","Customer Satisfaction":"High","Sustainability":"Neutral"},{"label":"D5 Forecast sharing","Cost":"Low","Lead Time":"Fast","CO₂ Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer Satisfaction":"High","Sustainability":"Neutral"},{"label":"D6 RESCUE drills","Cost":"Low","Lead Time":"Ongoing","CO₂ Impact":"Neutral","Risk":"Reduced- activation","Quality":"High","Customer Satisfaction":"High","Sustainability":"Neutral"},{"label":"D7 Geographic diversification","Cost":"Very High","Lead Time":"Very Long","CO₂ Impact":"Med","Risk":"Reduced","Quality":"High","Customer Satisfaction":"High","Sustainability":"Neutral"},{"label":"D8 Abandon JIT (c/f)","Cost":"Very High","Lead Time":"Long","CO₂ Impact":"High","Risk":"Reduced- blunt","Quality":"High","Customer Satisfaction":"High","Sustainability":"Negative"},{"label":"D9 Modified JIT (actual)","Cost":"Medium","Lead Time":"Ongoing","CO₂ Impact":"Med","Risk":"Reduced- optimal","Quality":"High","Customer Satisfaction":"High","Sustainability":"Positive"},{"_second_table_start_col":12},{"label":"AI sub-tier visibility","Cost":"High","Lead Time":"Long","CO₂ Impact":"Neutral","Risk":"Struct. Reduced","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"Climate risk scoring","Cost":"Medium","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"Struct. Reduced","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Positive","Circular Economy":"Neutral"},{"label":"Digital twin network","Cost":"Very High","Lead Time":"Long","CO₂ Impact":"Neutral","Risk":"Struct. Reduced","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"Buffer pooling with peers","Cost":"Medium","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"Seismic risk siting model","Cost":"Low-Med","Lead Time":"Long","CO₂ Impact":"Neutral","Risk":"Struct. Reduced","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"Supplier financial monitor","Cost":"Medium","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"Gov-industry data framework","Cost":"Low","Lead Time":"Long","CO₂ Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Positive","Circular Economy":"Neutral"}],"kpi_change_summary":[{"label":"Normal (pre-2011 JIT)","Buffer stock":"Near-zero","Sub-tier visibility":"None below tier-1","Disaster assessment time":"~2 weeks","Semiconductor risk":"Unrecognised (single-source)","Production loss":"78% (shock)","Financial":"77% profit drop","Resilience":"Near-zero","BCP Target":"None"},{"label":"Disruption (2011)","Buffer stock":"Zero","Sub-tier visibility":"Blind","Disaster assessment time":"2 weeks (too slow)","Semiconductor risk":"Realised — Renesas halt","Production loss":"78% April 2011","Financial":"77% net income drop","Resilience":"Zero","BCP Target":"None"}],"decision_scores":[{"label":"Modified JIT (actual strategic choice)","Cost":3,"Resilience Gain":5,"Feasibility":4,"Speed":3,"Sustainability":5,"Overall":4,"_overall_calculated":true},{"label":"RESCUE multi-tier database","Cost":3,"Resilience Gain":5,"Feasibility":3,"Speed":2,"Sustainability":4,"Overall":3.4,"_overall_calculated":true},{"label":"BCP buffer stock (2–6 months)","Cost":3,"Resilience Gain":5,"Feasibility":3,"Speed":3,"Sustainability":3,"Overall":3.4,"_overall_calculated":true},{"label":"RESCUE supplier training drills","Cost":5,"Resilience Gain":4,"Feasibility":5,"Speed":4,"Sustainability":4,"Overall":4.4,"_overall_calculated":true},{"label":"Multi-sourcing + design flex.","Cost":3,"Resilience Gain":5,"Feasibility":3,"Speed":3,"Sustainability":3,"Overall":3.4,"_overall_calculated":true},{"label":"Forecast sharing (3-year)","Cost":5,"Resilience Gain":4,"Feasibility":5,"Speed":4,"Sustainability":3,"Overall":4.2,"_overall_calculated":true},{"label":"Task force + supplier triage","Cost":4,"Resilience Gain":3,"Feasibility":4,"Speed":4,"Sustainability":3,"Overall":3.6,"_overall_calculated":true},{"label":"Geographic diversification","Cost":1,"Resilience Gain":4,"Feasibility":2,"Speed":1,"Sustainability":3,"Overall":2.2,"_overall_calculated":true},{"label":"Abandon JIT (counterfactual)","Cost":1,"Resilience Gain":3,"Feasibility":2,"Speed":2,"Sustainability":2,"Overall":2,"_overall_calculated":true}],"sources":["Matsuo, H. (2015). Implications of the Tohoku earthquake for Toyota's coordination mechanism: Supply chain disruption of automotive semiconductors. International Journal of Production Economics, 161, 217–227. DOI: 10.1016/j.ijpe.2014.07.003 — primary academic anchor.","Supply Chain Dive (May 2021) — 78% production fall (Matsuo 2015); BCP 2–6 months; CFO Kon semiconductor quotes. https://www.supplychaindive.com/news/toyota-semiconductor-shortage-earthquake-inventory-ihs-gartner-forecast-2022/600193/","Automotive Logistics (March 2021) — half-day vs two-weeks; RESCUE system; February 2021 Fukushima test. https://www.automotivelogistics.media/oems/a-stronger-supply-chain-since-fukushima/189342","Supply Chain Nuggets (Nov 2025) — 500 priority parts; 2-week BCP target; modified JIT / Sodhi & Choi. https://supplychainnuggets.com/lessons-from-toyotas-just-in-time-revamp/","Toyota Annual Report 2012 — BCP revision; output figures; Thailand floods. https://www.toyota-global.com/pages/contents/investors/ir_library/annual/pdf/2012/p30_31.pdf","Toyota USA Newsroom (April 2011) — production recovery timeline. https://pressroom.toyota.com/toyota-timeline-restoring-normal-production-april-2011/","US CRS Report R41831 (2011) — 150 parts shortage; 30% North America capacity; GM retaking sales lead. https://www.everycrsreport.com/reports/R41831.html"],"_sheet_name":"FIB-006"},{"id":"FIB-007","name":"KFC UK — 2018 Chicken Shortage: Single-DC logistics failure and crisis recovery","industry":"Food & QSR (Quick Service Restaurant) / Logistics & Distribution","brand_group":"KFC (Kentucky Fried Chicken) is a global fast-food chain owned by Yum! Brands. The UK is KFC's fifth largest market globally, contributing ~6% of its US$24.5bn global sales (2017). The UK has the largest fast-food chicken market in Europe. KFC UK operates ~900 restaurants, ~95% franchised.","scale":"~900 UK/Ireland restaurants; ~500 fresh-chicken farmers supplying the UK network; UK turnover £445.7M (2017 pre-crisis).","normal_flow_nodes":[{"label":"Node 1 — Fresh-chicken farmers (~500)","description":"Network of UK farms supplying fresh chickens daily to KFC. No buffer — birds are raised to a production schedule."},{"label":"Node 2 — Chicken processing plants","description":"Slaughterhouses and processors converting live birds to portioned fresh chicken for KFC."},{"label":"Node 3 — DHL Rugby depot (single DC)","description":"NEW: one warehouse in Rugby handling ALL 900 UK/Ireland stores from day 1. Unregistered for food storage, undertrained staff, new IT system."},{"label":"Node 4 — Bidvest (former 6-DC network)","description":"FORMER: Bidvest used 6 warehouses across the UK; specialist food-distribution experience; had handled KFC for years."},{"label":"Node 5 — Distribution routes / roads","description":"M6 motorway near Rugby; road network connecting the single depot to 900 stores."},{"label":"Node 6 — KFC restaurants (~900)","description":"Franchised restaurants; daily fresh-chicken delivery required; zero buffer stock (JIT food model)."},{"label":"Node 7 — Franchise owners","description":"Independent business owners operating KFC stores; had no role in the logistics decision."},{"label":"Node 8 — KFC customers / public","description":"UK consumers; largest fast-food chicken market in Europe; strong emotional attachment to the brand."}],"normal_flow_steps":[{"step":1,"process":"Farmers raise and deliver fresh chickens on a production schedule","node":"N1 Farmers → N2 Processing"},{"step":2,"process":"Processors portion and package fresh chicken to KFC specification","node":"N2 Processing → N3 DC"},{"step":3,"process":"DC (Rugby) receives, stores (chilled) and picks orders for each restaurant","node":"N3 DHL DC"},{"step":4,"process":"Trucks depart DC nightly for next-day delivery to restaurants","node":"N3 DC → N6 Restaurants"},{"step":5,"process":"Restaurants receive chilled delivery; prepare and serve chicken","node":"N6 Restaurants → N8 Customers"},{"step":6,"process":"Franchisees place next-day orders through DHL/QSL IT system","node":"N7 Franchisees → N3 DC"},{"step":7,"process":"KFC corporate monitors sales and supply; adjusts allocations","node":"KFC corporate → N3 DC"},{"step":8,"process":null,"node":null},{"step":9,"process":null,"node":null},{"step":10,"process":null,"node":null},{"step":11,"process":null,"node":null},{"step":12,"process":null,"node":null}],"kpis":[{"label":"Cost","value":"Lower contract price (DHL) vs Bidvest"},{"label":"Lead Time","value":"Daily fresh delivery required (JIT food)"},{"label":"CO₂ Impact","value":"Medium (road distribution network)"},{"label":"Waste","value":"Very high during crisis — chicken spoiling in depot/trucks (wrong temp settings, driver delays)"},{"label":"Customer Satisfaction","value":"Crashed to −17% net sentiment; recovered to +31% by end 2018"},{"label":"Risk","value":"Very high unrecognised — single DC, new operator, no contingency, no transition overlap"},{"label":"Quality","value":"Normal pre-crisis; chilled food spoilage during crisis"},{"label":"Sustainability","value":"High waste impact — ~500 farmers' supply stranded; spoilage throughout the system"},{"label":"Circular Economy","value":"Low — food waste is the primary circular concern here"}],"disruption":[{"label":"Trigger event","value":"14 February 2018 (Valentine's Day): DHL goes live as KFC UK's sole logistics provider. At ~01:40, a 7-vehicle collision on the M6 near Rugby blocks the motorway. A second accident involving two lorries follows shortly after at a nearby junction. All outbound routes from the single Rugby depot are blocked on day one."},{"label":"Root cause details","value":"Six Bidvest warehouses replaced by one DHL depot. No transition overlap. No contingency plan. DHL lacked chilled-food domain expertise. Staff undertrained. IT system untested at scale. Cold storage unregistered with the council. A foreseeable road event near Rugby exposed zero resilience. Road accidents on the M6 near Rugby blocked all truck movements from the single DHL distribution centre on its first day of operation. (1) Incorrect temperature regulators in trailers → chicken spoiling. (2) DHL depot unregistered for food storage with Rugby Borough Council. (3) New IT/QSL system untested. (4) No reversion plan — Bidvest had already laid off 255 staff and wound down operations. (5) ~500 farmers' supply stranded upstream."},{"label":"Affected nodes","value":"Day 1: routes blocked. Day 2–3: restaurants begin closing.~330–430 open of ~900 (~37–48% open) at reported peak dates (19–20 Feb 2018)"},{"label":"Effect on Supply chain","value":"Near-total UK restaurant closure; ~£1M/day revenue loss; franchisee income destroyed; 500 farmers' supply wasted; brand crisis; police fielding calls about chicken shortages; global media coverage."}],"decision_blocks":[{"source":"Decision Analysis by the Company","decisions":[{"Decision No":"1","Description":"Wait for DHL to fix the problem","Action":"Trust DHL to resolve its own failure","Cost":"Low (short-term)","Lead Time":"Crisis deepened daily","CO2 Impact":"Low","Risk":"Very High","Quality":"Collapsed","Customer satisfaction":"Very Low","Sustainability":"n/a","Circular Economy":"n/a","Best when":"Never — DHL lacked the capability; waiting destroyed franchisee revenue daily"},{"Decision No":2,"Description":"Rehire Bidvest for partial network","Action":"Bring back the proven supplier for ~350 Northern England restaurants","Cost":"Medium-High (re-onboarding)","Lead Time":"Improved for Bidvest stores","CO2 Impact":"Low","Risk":"Reduced partial","Quality":"Partial","Customer satisfaction":"Partial","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"When the new provider is clearly unable to deliver and the old one is available"},{"Decision No":3,"Description":"Run 24/7 delivery operations","Action":"DHL operates the depot 24/7 to clear the backlog","Cost":"High (overtime)","Lead Time":"Improved","CO2 Impact":"Med","Risk":"Reduced","Quality":"Partial","Customer satisfaction":"Improving","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"When backlog is recoverable and staff capacity allows surge"},{"Decision No":4,"Description":"Publish live open-store list / microsite","Action":"Real-time website showing which stores are open; updated daily","Cost":"Low","Lead Time":"n/a","CO2 Impact":"Low","Risk":"Reduced (frustration)","Quality":"n/a","Customer satisfaction":"Increased (managed exp.)","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Immediately when closures are widespread — reduces customer wasted journeys"},{"Decision No":5,"Description":"FCK apology campaign (print + social)","Action":"Full-page ad in Sun/Metro; humility/humour/honesty; took full accountability; did not blame DHL","Cost":"Low (media buy)","Lead Time":"n/a","CO2 Impact":"Low","Risk":"Reduced reput.","Quality":"n/a","Customer satisfaction":"Increased (brand recovery)","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"When the mistake is publicly known and blame-shifting would make it worse; requires brand voice consistency"},{"Decision No":6,"Description":"Pause all advertising","Action":"Stop all KFC UK advertising during the crisis","Cost":"Low","Lead Time":"n/a","CO2 Impact":"Low","Risk":"Reduced reput. damage","Quality":"n/a","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Immediately — advertising during a product shortage is tone-deaf and generates backlash"},{"Decision No":7,"Description":"Return to multi-DC model (long-term)","Action":"End single-hub; multi-supplier; multi-warehouse; backup routes","Cost":"High (restructuring)","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Reduced struct.","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"After single-node failure — the structural fix that should have been the original model"},{"Decision No":8,"Description":"Build supplier transition testing plans","Action":"Mandate parallel-run periods and scenario testing for any future logistics transition","Cost":"Low-Med","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Reduced struct.","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"Before ANY logistics provider change — should have been standard before DHL go-live"},{"Decision No":9,"Description":"Partner with Booker/Tesco (2020)","Action":"Add a second distribution partner with national coverage for additional redundancy","Cost":"Medium","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Reduced struct.","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"When distribution reliability is a strategic competitive differentiator"},{"Decision No":10,"Description":"Develop internal logistics competency","Action":"Build in-house logistics expertise at the board/executive level so KFC cannot be blind-sided by a supplier's capabilities","Cost":"Medium (talent)","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Reduced struct.","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"Logistics is a core competency in food service — outsourcing does not outsource the knowledge requirement"}]},{"source":"Decision Analysis  (Self Analysis)","decisions":[{"Decision No":"1","Description":"Mandatory dual-DC model for chilled food","Action":"Require minimum two distribution centres for any chilled food network — no single node can serve the entire UK","Cost":"High","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"Before any logistics contract change; non-negotiable for perishable supply chains"},{"Decision No":2,"Description":"Parallel-run transition protocol (minimum 8 weeks)","Action":"Mandate that any logistics provider change runs old and new systems in parallel for at least 8 weeks before cutover","Cost":"Medium","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"Before ANY distribution network transition — the hardest lesson from KFC: never go live without overlap"},{"Decision No":3,"Description":"Cold-chain IoT sensor monitoring","Action":"Install IoT temperature and humidity sensors in every trailer and DC; trigger automatic alerts if cold chain breaks","Cost":"Low-Med","Lead Time":"Medium","CO2 Impact":"Low","Risk":"Structurally Reduced","Quality":"Greatly Improved","Customer satisfaction":"Protected","Sustainability":"Positive","Circular Economy":"Neutral","Best when":"When chilled food spoilage during distribution represents both food waste and brand risk"},{"Decision No":4,"Description":"AI route optimisation with automatic rerouting","Action":"Deploy AI routing that detects road closures, accidents and traffic in real time and automatically rereroutes trucks","Cost":"Medium","Lead Time":"Medium","CO2 Impact":"Reduced","Risk":"Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"When a single road incident near a sole DC can halt all deliveries — the M6 scenario must be pre-planned"},{"Decision No":5,"Description":"Supplier transition insurance","Action":"Purchase specific logistics-transition insurance that covers lost franchisee revenue during a planned provider change","Cost":"Low","Lead Time":"Fast","CO2 Impact":"Neutral","Risk":"Financial hedge","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"Whenever a major logistics change is planned; premium is small relative to £1M/day exposure"},{"Decision No":6},{"Decision No":7}]}],"decisions_impact_summary":[{"label":"D1 Wait for DHL fix","Cost":"Low","Lead Time":"Crisis deepened","CO₂ Impact":"Low","Risk":"Very High","Quality":"Collapsed","Customer Satisfaction":"Very Low","Sustainability":"n/a","Circular Economy":"n/a"},{"label":"D2 Rehire Bidvest (partial)","Cost":"Med-High","Lead Time":"Improved (350 stores)","CO₂ Impact":"Low","Risk":"Reduced- partial","Quality":"Partial","Customer Satisfaction":"Partial","Sustainability":"Neutral","Circular Economy":"n/a"},{"label":"D3 24/7 operations","Cost":"High","Lead Time":"Improved","CO₂ Impact":"Med","Risk":"Reduced-","Quality":"Partial","Customer Satisfaction":"Improving","Sustainability":"Neutral","Circular Economy":"n/a"},{"label":"D4 Live open-store microsite","Cost":"Low","Lead Time":"n/a","CO₂ Impact":"Low","Risk":"Reduced- frustration","Quality":"n/a","Customer Satisfaction":"Increased- managed","Sustainability":"Neutral","Circular Economy":"n/a"},{"label":"D5 FCK ad campaign","Cost":"Low","Lead Time":"n/a","CO₂ Impact":"Low","Risk":"Reduced- reput.","Quality":"n/a","Customer Satisfaction":"Increased- brand","Sustainability":"Neutral","Circular Economy":"n/a"},{"label":"D6 Pause advertising","Cost":"Low","Lead Time":"n/a","CO₂ Impact":"Low","Risk":"Reduced- damage","Quality":"n/a","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"n/a"},{"label":"D7 Return multi-DC (LT)","Cost":"High","Lead Time":"Long","CO₂ Impact":"Neutral","Risk":"Reduced- struct.","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"D8 Transition testing plans","Cost":"Low-Med","Lead Time":"Long","CO₂ Impact":"Neutral","Risk":"Reduced- struct.","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"D9 Booker/Tesco partner","Cost":"Medium","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"Reduced- struct.","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"D10 Internal logistics competency","Cost":"Medium","Lead Time":"Long","CO₂ Impact":"Neutral","Risk":"Reduced- struct.","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"_second_table_start_col":12},{"label":"Dual-DC mandatory model","Cost":"High","Lead Time":"Long","CO₂ Impact":"Neutral","Risk":"Struct. Reduced","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"Parallel-run protocol","Cost":"Medium","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"Struct. Reduced","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"Cold-chain IoT sensors","Cost":"Low-Med","Lead Time":"Medium","CO₂ Impact":"Low","Risk":"Struct. Reduced","Quality":"Greatly Increased","Customer Satisfaction":"Protected","Sustainability":"Positive","Circular Economy":"Neutral"},{"label":"AI route rerouting","Cost":"Medium","Lead Time":"Medium","CO₂ Impact":"Reduced","Risk":"Reduced","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"Franchisee risk-sharing","Cost":"Low","Lead Time":"Fast","CO₂ Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer Satisfaction":"Improved","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"Digital twin logistics","Cost":"Medium","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"Struct. Reduced","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"Transition insurance","Cost":"Low","Lead Time":"Fast","CO₂ Impact":"Neutral","Risk":"Financial hedge","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"}],"kpi_change_summary":[{"label":"Normal (Bidvest, pre-2018)","Stores open":"~870 (~100%)","Revenue/day":"~£1.2M+","Cust. sentiment":"Stable (7.3% share)","Brand share":"7.3%","DC nodes":"6 warehouses","Supplier":"Bidvest (food specialist)","Waste":"Low","Resiliences":"High"},{"label":"Crisis peak (Feb 2018)","Stores open":"266 (~30%)","Revenue/day":"~£0M (closed stores)","Cust. sentiment":"−17% net sentiment","Brand share":"Falling","DC nodes":"1 Rugby depot","Supplier":"DHL (day 1 failure)","Waste":"Very High (spoilage)","Resiliences":"Zero"},{"label":"Recovery (Mar 2018)","Stores open":"Restoring","Revenue/day":"~£0.8M+","Cust. sentiment":"Recovering","Brand share":"Recovering","DC nodes":"DHL + Bidvest (split)","Supplier":"Dual (emergency)","Waste":"Reducing","Resiliences":"Low-Medium"},{"label":"Post-crisis (2019–2020)","Stores open":"~900 (full)","Revenue/day":"Full recovery","Cust. sentiment":"+31% / 8.1% share","Brand share":"8.1% (record)","DC nodes":"Multi-DC + Booker","Supplier":"Bidvest + Booker/Tesco","Waste":"Low","Resiliences":"High(Multi-Node)"}],"decision_scores":[{"label":"KFC apology campaign","Cost":5,"Resilience Gain":4,"Feasibility":5,"Speed":5,"Sustainability":3,"Overall":4.4,"_overall_calculated":true},{"label":"Live open-store microsite","Cost":5,"Resilience Gain":4,"Feasibility":5,"Speed":5,"Sustainability":3,"Overall":4.4,"_overall_calculated":true},{"label":"Return to multi-DC model","Cost":3,"Resilience Gain":5,"Feasibility":4,"Speed":2,"Sustainability":3,"Overall":3.4,"_overall_calculated":true},{"label":"Supplier transition testing","Cost":4,"Resilience Gain":5,"Feasibility":5,"Speed":4,"Sustainability":3,"Overall":4.2,"_overall_calculated":true},{"label":"Rehire Bidvest (partial)","Cost":3,"Resilience Gain":4,"Feasibility":4,"Speed":4,"Sustainability":3,"Overall":3.6,"_overall_calculated":true},{"label":"Internal logistics competency","Cost":3,"Resilience Gain":5,"Feasibility":3,"Speed":2,"Sustainability":3,"Overall":3.2,"_overall_calculated":true},{"label":"Booker/Tesco partnership","Cost":3,"Resilience Gain":4,"Feasibility":4,"Speed":3,"Sustainability":3,"Overall":3.4,"_overall_calculated":true},{"label":"Pause advertising","Cost":5,"Resilience Gain":3,"Feasibility":5,"Speed":5,"Sustainability":3,"Overall":4.2,"_overall_calculated":true},{"label":"24/7 operations","Cost":2,"Resilience Gain":3,"Feasibility":3,"Speed":3,"Sustainability":3,"Overall":2.8,"_overall_calculated":true},{"label":"Wait for DHL fix","Cost":3,"Resilience Gain":1,"Feasibility":4,"Speed":5,"Sustainability":3,"Overall":3.2,"_overall_calculated":true}],"sources":["Ceres Shop — M6 accident timing; Rugby depot; Samir Dani 'perfect storm' analysis; spoilage reports. https://ceres.shop/blog/the-saga-of-the-2018-kfc-chicken-shortage/","About Resilience — GMB warning; DHL/QSL contract details; YouGov data; full-year financial figures (turnover £445.7M → £207.3M; PAT -27.8%). https://www.aboutresilience.com/humor-and-humility-saved-the-chicken-the-kfc-logistics-blunder/","FCSI (Foodservice Consultants) — former DHL operations director Gerry Brown expert analysis of root causes; 'plan for failure' quote; domain-knowledge issue. https://www.fcsi.org/foodservice-consultant/eame/kfc-supply-chain-fail/","Supply Chain Nuggets — long-term structural changes; Booker/Tesco 2020 partnership; 300 new DHL jobs. https://supplychainnuggets.com/lessons-from-kfcs-supplier-change-issues-in-the-uk/","Campaign Live — FCK campaign 'three Hs'; Cannes Lions wins; Mother agency; brand sentiment recovery. https://www.campaignlive.co.uk/article/kfc-fcking-clever-campaign/1498912 (Ikon London Magazine (near-identical original content) or BBC/Fortune contemporaneous coverage)","Newsworks — £1M/day revenue loss; 733 press articles from FCK ad; reach of 797M + 219M social. https://newsworks.org.uk/planning/case-studies/kfc-the-great-chicken-crisis/","YouGov BrandIndex — net sentiment -17% to +31%; market share 7.3% (2017) to 8.1% (2019). (via About Resilience and YourStory sources)","YourStory (April 2025) — day-by-day timeline; Valentine's Day context; police calls; microsite response. https://yourstory.com/2025/04/kfc-shut-750-branches-2018-mind-bending-business-case-study"],"_sheet_name":"FIB-007"},{"id":"FIB-008","name":"Firestone/Ford — ATX & Wilderness AT tire recall (2000): tread separation, fatalities and the TREAD Act","industry":"Automotive / Tire Manufacturing / Consumer Product Safety","brand_group":"Firestone (Bridgestone/Firestone Inc.) — one of the largest tire makers in the world; acquired by Japan's Bridgestone in 1988. Ford Motor Company — one of the world's largest automakers. The two companies had a near-century-old relationship dating to Harvey Firestone and Henry Ford's personal friendship in 1906.","scale":"Firestone Radial ATX, ATX II and Wilderness AT tires (primarily P235/75R15 size). Mounted as original equipment on Ford Explorer, Ford Ranger, Ford F-150, Mercury Mountaineer, Mazda Navajo and Mazda B-series.","normal_flow_nodes":[{"label":"Node 1 — Raw materials (rubber, steel belt, chemicals)","description":"Inputs to tire manufacturing. Belt-edge rubber compound and inner liner specifications were central to the failure mode."},{"label":"Node 2 — Firestone manufacturing (Decatur IL primary)","description":"Firestone Fab 22 (Decatur IL) produced ATX/Wilderness AT tires at a significantly higher failure rate than Wilson NC and Joliette Quebec plants making the same model."},{"label":"Node 3 — Quality control / warranty systems","description":"Firestone's warranty-claims database recorded thousands of tread-separation failures from 1996. Systematically misattributed to consumer error."},{"label":"Node 4 — Ford vehicle design (Explorer)","description":"Ford's Explorer design: high centre of gravity (rollover risk); Ford recommended 26 psi tire inflation (vs Firestone's 30 psi) to reduce rollover tendency."},{"label":"Node 5 — Dealer / installer network","description":"New-vehicle dealers and tire retailers installing the tires on Explorers and trucks."},{"label":"Node 6 — NHTSA (regulator)","description":"National Highway Traffic Safety Administration responsible for vehicle and tire safety. Hotline complaints were suppressed by plaintiff attorneys; overseas data not reported by Ford."},{"label":"Node 7 — Consumers / drivers","description":"Owners of ~6.5M recalled tires; most in hot southern states (California, Arizona, Texas, Florida) where heat amplified the failure."}],"normal_flow_steps":[{"step":1,"process":"Raw materials sourced and compounded for tire manufacturing","node":"N1 Raw materials → N2 Manufacturing"},{"step":2,"process":"Tires manufactured at Decatur IL (primary), Wilson NC, Joliette QC","node":"N2 Firestone manufacturing"},{"step":3,"process":"Quality control and warranty-claims tracking at Firestone","node":"N3 QC / warranty systems"},{"step":4,"process":"Tires shipped to Ford and other OEMs as original equipment","node":"N2 → N4 Ford / OEM fitment"},{"step":5,"process":"Ford designs Explorer with 26 psi inflation recommendation (vs Firestone's 30 psi)","node":"N4 Ford vehicle design"},{"step":6,"process":"Tires fitted to Explorers at assembly; sold through dealer network","node":"N5 Dealer / installer"},{"step":7,"process":"Consumers drive in hot climates; tread separates at highway speed; Explorer rolls over","node":"N7 Consumers — failure mode"},{"step":8,"process":"Warranty claims filed; attorneys aware; NHTSA hotline NOT used; overseas recalls NOT reported","node":"N3/N6/N8 — suppression nodes"},{"step":9,"process":null,"node":null},{"step":10,"process":null,"node":null},{"step":11,"process":null,"node":null}],"kpis":[{"label":"Tires in recall (initial)","value":"6.5 million (of 14.4M produced)"},{"label":"Tires in extended recall (Ford, 2001)","value":"13 million Wilderness AT"},{"label":"US fatalities attributed","value":"271 (as of Sept 2001) NHTSA's count rose repeatedly (119→148→174→203→271, late 2000–Sept 2001); some later secondary sources (e.g., current Wikipedia) cite 238 for US deaths depending on cutoff/methodology"},{"label":"US injuries attributed","value":"500+"},{"label":"International fatalities","value":"46 (Venezuela) + others"},{"label":"Years of known risk before mass recall","value":"~4–6 years, depending on start point (1996 Arizona warning vs. 1997-98 internal overseas testing awareness)"},{"label":"Decatur failure rate vs other plants","value":"Significantly higher (primary evidence of plant-level QC failure)"},{"label":"Ford inflation recommendation","value":"26 psi"},{"label":"Wilderness AT heat rating","value":"Grade C (lowest allowed by NHTSA UTQG)"},{"label":"Ford Explorer lawsuits settled","value":"~1,500 cases"}],"disruption":[{"label":"Trigger event","value":"Media investigation: In early 2000, Houston TV station KHOU ran an investigative report on Firestone tire failures and Explorer rollovers. The Chicago Sun-Times and New York Times followed. Media pressure forced NHTSA to open a formal investigation (PE00-020) on May 2, 2000 — the actual trigger was journalism, not company or regulator action."},{"label":"Root cause (technical)","value":"Tread separation: belt-edge rubber compound in ATX/Wilderness AT tires separated under heat, load and speed. Heat (hot climates, high speed, heavy load) accelerated belt-edge oxidation. Firestone's 1993 Wilderness AT design had a Grade C heat rating — the minimum allowed. The Decatur plant's manufacturing process produced tires with higher internal defect rates than sister plants. Decatur defect rate spike coincides with 1994–1996 labor dispute period (replacement workers); tires from that period were ~15x more likely to generate a claim than tires from other plants."},{"label":"Root cause (structural — Firestone)","value":"Warranty-claims data suppressed (attributed to consumer misuse). No proactive investigation. Overseas warning signs (1996 Arizona; 1998 Ford overseas complaints; 1998 State Farm insurance data) ignored. Firestone sent engineers to Arizona in 1996, concluded 'normal passenger tires being used in heavy conditions' — a coverup conclusion."},{"label":"Root cause (structural — Ford)","value":"Ford recommended 26 psi vs Firestone's 30 psi — increasing thermal stress on the tire. Ford began replacing Firestone tires in overseas markets (Venezuela, Saudi Arabia, Thailand) in late 1999 without notifying NHTSA — a legal violation. Ford used Firestone as sole-source original equipment without independent quality verification."},{"label":"Root cause (systemic)","value":"System-level interaction: the Explorer's rollover tendency (high CoG) + Firestone tread separation = fatalities. Neither failure mode alone was necessarily lethal; together they were. Neither company tested the system-level interaction."},{"label":"Suppression mechanism","value":"Plaintiff attorneys stopped using the NHTSA hotline (feared investigation would compromise lawsuits). Firestone suppressed warranty data. Ford did not disclose overseas replacements. NHTSA was blind from multiple directions simultaneously. Of 271 US deaths, 258 occurred after 1996 — after the problem was already known."},{"label":"Effect on supply chain","value":"~6.5M initial recall + 13M extended coinciding with Firestone formally severing its 100-year OEM supply relationship with Ford; 271 US deaths; Firestone market share collapse; 100-year Ford–Firestone relationship ended permanently; TREAD Act passed; industry-wide supplier-quality practices reformed."}],"decision_blocks":[{"source":"Decision Analysis by the Company","decisions":[{"Decision No":"1","Description":"Deny and attribute to consumer error","Action":"Attribute all warranty claims to improper inflation, off-road use, overloading","Cost":"Very Low (short-term)","Lead Time":"Crisis delayed — deaths continued","CO2 Impact":"Low","Risk":"MAXIMISED (catastrophic)","Quality":"Destroyed","Customer satisfaction":"Very Low","Sustainability":"n/a","Circular Economy":"n/a","Best when":"Never — suppression converts a manageable recall into a criminal liability"},{"Decision No":2,"Description":"Replace tires overseas without notifying NHTSA","Action":"Replace Firestone tires on Explorers in Venezuela, Saudi Arabia, Thailand without US disclosure","Cost":"Low","Lead Time":"Danger continued in US","CO2 Impact":"Low","Risk":"MAXIMISED (US)","Quality":"Maintained overseas","Customer satisfaction":"Very Low (US)","Sustainability":"n/a","Circular Economy":"n/a","Best when":"Never — overseas replacement without domestic disclosure is illegal and unconscionable"},{"Decision No":3,"Description":"Commission NHTSA formal investigation","Action":"NHTSA opens formal investigation PE00-020 after media pressure","Cost":"Low (regulatory)","Lead Time":"Critical path to recall","CO2 Impact":"Low","Risk":"ReducedReduced formal","Quality":"n/a","Customer satisfaction":"Increased (public)","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"When safety data patterns meet the threshold for formal inquiry — should have happened in 1997–98"},{"Decision No":4,"Description":"Issue voluntary recall (6.5M tires)","Action":"Recall ATX/ATXII and Decatur Wilderness AT tires; phase by geography; replace with competitors if necessary","Cost":"High (recall logistics)","Lead Time":"Critical path","CO2 Impact":"Low","Risk":"ReducedReduced","Quality":"Partial","Customer satisfaction":"Medium","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"When defect is confirmed and public safety at risk — should have happened in 1996–97"},{"Decision No":5,"Description":"Extend recall to 13M Wilderness AT (unilateral)","Action":"Replace ALL Wilderness AT tires on Ford vehicles regardless of plant","Cost":"Very High","Lead Time":"Long","CO2 Impact":"Low","Risk":"ReducedReduced struct.","Quality":"Higher","Customer satisfaction":"Higher","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"When the initial recall scope is insufficient and the OEM has independent evidence — terminated the Firestone relationship"},{"Decision No":6,"Description":"Congressional investigation and public testimony","Action":"Public hearings; CEO testimony; document production; revealed 1996 knowledge","Cost":"Low (political)","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Reduced struct.","Quality":"High","Customer satisfaction":"Increased (public trust)","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"When corporate disclosure is inadequate and public safety demands accountability"},{"Decision No":7,"Description":"Pass TREAD Act — early warning reporting","Action":"Mandate proactive disclosure of safety-defect patterns; international recall disclosure; TPMS","Cost":"Low (legislation)","Lead Time":"Long (implementation)","CO2 Impact":"Neutral","Risk":"ReducedReduced struct.","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"After a systemic regulatory information failure kills hundreds of people"},{"Decision No":8,"Description":"Implement TPMS — hardware mandate","Action":"Tyre Pressure Monitoring Systems in all new US passenger vehicles","Cost":"Medium (per vehicle)","Lead Time":"Long (production cycle)","CO2 Impact":"Low","Risk":"ReducedReduced (future)","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Low (batteries)","Best when":"After the inflation-contribution to tread separation is documented — a direct engineering response to a specific failure mode"},{"Decision No":9,"Description":"Plant-level quality traceability (systemic)","Action":"Trace every tire to manufacturing cell, shift, batch — enable precise defect identification by production source","Cost":"Medium (infrastructure)","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"ReducedReduced struct.","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Low (materials)","Best when":"After Decatur shows plant-level inconsistency is invisible without granular traceability"},{"Decision No":10,"Description":"System-level product testing (tire + vehicle)","Action":"Test critical safety components in the actual vehicle operating context — not in isolation","Cost":"Medium","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"ReducedReduced struct.","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Always for safety-critical OEM-supplier component interactions — the failure mode required both defects to be present"}]},{"source":"Decision Analysis  (Self Analysis)","decisions":[{"Decision No":"1","Description":"AI-powered warranty-data anomaly detection","Action":"Apply ML to warranty claims in real time to flag failure-mode patterns by plant, batch and climate region","Cost":"Medium","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"Greatly Improved","Customer satisfaction":"Protected","Sustainability":"Positive","Circular Economy":"Neutral","Best when":"As soon as warranty data volumes allow ML — a 1996 model trained on Firestone data would have flagged Decatur within months"},{"Decision No":2,"Description":"Plant-level manufacturing traceability (batch+machine)","Action":"Encode plant ID, machine ID, shift and batch number into every tire; enable field-failure attribution to production source","Cost":"Medium","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"Greatly Improved","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"Immediately; the Decatur vs Wilson/Joliette failure rate difference was invisible without this"},{"Decision No":3,"Description":"Mandatory international recall cross-reporting","Action":"Require OEMs and suppliers to disclose overseas recalls to domestic regulators within 30 days","Cost":"Low","Lead Time":"Fast","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"Greatly Improved","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"Always; Ford replaced tires in Venezuela while US consumers drove on the same ones — this gap cost lives"},{"Decision No":4,"Description":"System-level OEM-supplier joint testing protocol","Action":"Require that safety-critical components are tested in the actual vehicle operating context, not in isolation","Cost":"Medium","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"Greatly Improved","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"At product launch and when OEM specifies different operating parameters than supplier recommends"},{"Decision No":5,"Description":"Real-time field failure monitoring IoT","Action":"Partner with fleet operators to install IoT tyre pressure and temperature sensors; feed field data back to QC teams in real time","Cost":"High","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Reduced","Quality":"Greatly Improved","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"When a product's failure mode is heat and speed-activated — field sensors detect patterns faster than warranty claims"},{"Decision No":6,"Description":"Consumer safety reporting digital portal","Action":"Build a publicly accessible, verified safety-defect reporting portal that feeds directly to NHTSA — bypassing attorney suppression","Cost":"Low","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Reduced","Quality":"Greatly Improved","Customer satisfaction":"Greatly Improved","Sustainability":"Positive","Circular Economy":"Neutral","Best when":"When the existing hotline is suppressed by legal incentives — direct reporting reduces the suppression gap"},{"Decision No":7,"Description":"Product liability blockchain for traceability","Action":"Record every component, assembly, and QC inspection on an immutable blockchain so that liability attribution is instant and undeniable","Cost":"High","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"Greatly Improved","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"For safety-critical components; makes suppression structurally impossible and recall scope instantly definable"}]}],"decisions_impact_summary":[{"label":"Deny / attribute consumer error","Cost":"Very Low (temp)","Lead Time":"Deaths continued","CO₂ Impact":"Low","Risk":"MAXIMISED","Quality":"Destroyed","Customer Satisfaction":"Very Low","Sustainability":"n/a","Circular Economy":"n/a"},{"label":"Overseas replace / no US disclosure","Cost":"Low","Lead Time":"US danger continued","CO₂ Impact":"Low","Risk":"MAXIMISED US","Quality":"Maintained OS","Customer Satisfaction":"Very Low US","Sustainability":"n/a","Circular Economy":"n/a"},{"label":"NHTSA formal investigation","Cost":"Low","Lead Time":"Critical path","CO₂ Impact":"Low","Risk":"ReducedReduced formal","Quality":"n/a","Customer Satisfaction":"Increased (public)","Sustainability":"Neutral","Circular Economy":"n/a"},{"label":"Voluntary recall (6.5M)","Cost":"High","Lead Time":"Long","CO₂ Impact":"Low","Risk":"ReducedReduced","Quality":"Partial","Customer Satisfaction":"Medium","Sustainability":"Neutral","Circular Economy":"n/a"},{"label":"Ford extended recall (13M)","Cost":"Very High","Lead Time":"Long","CO₂ Impact":"Low","Risk":"ReducedReduced struct.","Quality":"Higher","Customer Satisfaction":"Higher","Sustainability":"Neutral","Circular Economy":"n/a"},{"label":"Congressional investigation","Cost":"Low","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"Reduced struct.","Quality":"High","Customer Satisfaction":"Increased trust","Sustainability":"Neutral","Circular Economy":"n/a"},{"label":"TREAD Act","Cost":"Low","Lead Time":"Long","CO₂ Impact":"Neutral","Risk":"ReducedReduced struct.","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"TPMS mandate","Cost":"Medium","Lead Time":"Long","CO₂ Impact":"Low","Risk":"ReducedReduced future","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Low"},{"label":"Plant-level traceability","Cost":"Medium","Lead Time":"Long","CO₂ Impact":"Neutral","Risk":"ReducedReduced struct.","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Low"},{"label":"System-level testing","Cost":"Medium","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"ReducedReduced struct.","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"n/a"},{"_second_table_start_col":12},{"label":"Warranty AI anomaly detection","Cost":"Medium","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"Struct. Reduced","Quality":"Greatly Increased","Customer Satisfaction":"Protected","Sustainability":"Positive","Circular Economy":"Neutral"},{"label":"Plant-level traceability","Cost":"Medium","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"Struct. Reduced","Quality":"Greatly Increased","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"International recall reporting","Cost":"Low","Lead Time":"Fast","CO₂ Impact":"Neutral","Risk":"Struct. Reduced","Quality":"Greatly Increased","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"System-level joint testing","Cost":"Medium","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"Struct. Reduced","Quality":"Greatly Increased","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"Field failure IoT monitoring","Cost":"High","Lead Time":"Long","CO₂ Impact":"Neutral","Risk":"Reduced","Quality":"Greatly Increased","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"Consumer safety portal","Cost":"Low","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"Reduced","Quality":"Greatly Increased","Customer Satisfaction":"Greatly Increased","Sustainability":"Positive","Circular Economy":"Neutral"},{"label":"Product liability blockchain","Cost":"High","Lead Time":"Long","CO₂ Impact":"Neutral","Risk":"Struct. Reduced","Quality":"Greatly Increased","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"}],"kpi_change_summary":[{"label":"Normal (pre-1996)","Lives at risk":"Unknown — risk unrecognised","Quality signal":"Warranty data accumulating (unreported)","Regulatory visibility":"Blind (NHTSA)","Recall scope":"Zero","Supplier relationship":"100-year partnership","Industry QC standard":"Minimal plant-level tracing","Consumer trust":"High","Regulatory Framework":"Pre-TREAD Act (limited)"},{"label":"1996–2000 (suppressed)","Lives at risk":"Very High — 258 preventable deaths","Quality signal":"Suppressed (consumer blamed)","Regulatory visibility":"Still blind","Recall scope":"Zero","Supplier relationship":"Partnership intact but strained","Industry QC standard":"No change","Consumer trust":"Declining (unaware)","Regulatory Framework":"Still pre-TREAD"},{"label":"2000 recall (reactive)","Lives at risk":"High (6.5M tires on road)","Quality signal":"Exposed via media/NHTSA","Regulatory visibility":"Partial (PE00-020)","Recall scope":"6.5M → 13M","Supplier relationship":"Collapsed permanently","Industry QC standard":"Scrutinised","Consumer trust":"Very Low","Regulatory Framework":"TREAD Act passed Nov 2000"},{"label":"Post-TREAD Act (2001+)","Lives at risk":"Lower (TPMS; early warning)","Quality signal":"Early warning mandatory","Regulatory visibility":"High (TREAD Act)","Recall scope":"Systemic","Supplier relationship":"Rebuilt with new suppliers","Industry QC standard":"Plant-level QC standard","Consumer trust":"Recovering (slowly)","Regulatory Framework":"TREAD Act in force; TPMS mandate"}],"decision_scores":[{"label":"TREAD Act — early warning reporting","Cost":4,"Resilience Gain":5,"Feasibility":5,"Speed":3,"Sustainability":4,"Overall":4.2,"_overall_calculated":true},{"label":"TPMS hardware mandate","Cost":3,"Resilience Gain":5,"Feasibility":4,"Speed":2,"Sustainability":4,"Overall":3.6,"_overall_calculated":true},{"label":"Plant-level quality traceability","Cost":3,"Resilience Gain":5,"Feasibility":4,"Speed":3,"Sustainability":4,"Overall":3.8,"_overall_calculated":true},{"label":"System-level product testing","Cost":3,"Resilience Gain":5,"Feasibility":4,"Speed":4,"Sustainability":4,"Overall":4,"_overall_calculated":true},{"label":"Voluntary recall (6.5M)","Cost":2,"Resilience Gain":4,"Feasibility":3,"Speed":3,"Sustainability":3,"Overall":3,"_overall_calculated":true},{"label":"Ford extended recall (13M)","Cost":1,"Resilience Gain":5,"Feasibility":2,"Speed":2,"Sustainability":3,"Overall":2.6,"_overall_calculated":true},{"label":"NHTSA formal investigation","Cost":5,"Resilience Gain":4,"Feasibility":5,"Speed":3,"Sustainability":3,"Overall":4,"_overall_calculated":true},{"label":"Congressional investigation","Cost":5,"Resilience Gain":3,"Feasibility":4,"Speed":3,"Sustainability":3,"Overall":3.6,"_overall_calculated":true},{"label":"Overseas replace / no US disclosure","Cost":4,"Resilience Gain":1,"Feasibility":1,"Speed":5,"Sustainability":1,"Overall":2.4,"_overall_calculated":true},{"label":"Deny / attribute consumer error","Cost":5,"Resilience Gain":1,"Feasibility":1,"Speed":5,"Sustainability":1,"Overall":2.6,"_overall_calculated":true}],"sources":["NHTSA Investigation EA00-023 (primary regulatory document — tread separation analysis; Decatur failure rates; Wilson/Joliette data; 26 psi issue). https://www.nhtsa.gov/sites/nhtsa.gov/files/firestonereport.pdf","Wikipedia — Firestone and Ford tire controversy (comprehensive timeline; TREAD Act; 271 deaths; attorney hotline suppression). https://en.wikipedia.org/wiki/Firestone_and_Ford_tire_controversy","Center for Auto Safety — Congressional testimony; 6.5M vs 14.4M recall distinction; overseas replacement timeline. https://www.autosafety.org/ford-explorer-firestone-tire/","Public Citizen (2001) — The Real Root Cause of the Ford-Firestone Tragedy; 184 deaths figure; 16-inch tire scope issue. https://www.citizen.org/wp-content/uploads/rootcause.pdf","EBSCO Research Starters — Decatur plant closure; John Lampe CEO; phased recall timeline. https://www.ebsco.com/research-starters/history/bridgestonefirestone-announces-massive-recall","Forensic Group — MDL 1373 litigation summary; rollover sequence; inflation guidance disputes. https://www.forensisgroup.com/resources/expert-legal-witness-blog/accident-reconstruction-in-the-ford-firestone-tire-recall","Safety Research & Strategies (2009) — post-recall Explorer rollover deaths analysis; long-term failure to reduce fatality rate. https://www.safetyresearch.net/tire-related-explorer-rollover-deaths-continue-to-climb/","Connecticut General Assembly Research Report (2000) — live contemporaneous timeline; NHTSA death counts; Ford pressure recommendation. https://www.cga.ct.gov/2000/rpt/2000-R-1086.htm"],"_sheet_name":"FIB-008"},{"id":"FIB-009","name":"1997 Aisin Seiki Fire — Toyota network resilience and self-organised supplier recovery","industry":"Automotive Manufacturing / Supplier Network Resilience","brand_group":"Aisin Seiki Co. (Tier-1 supplier, Toyota Group) · Toyota Motor Corporation · ~200 Toyota-group suppliers","scale":"Toyota estimated losses of ~$195M from the shutdown; approximately 70,000 vehicles affected","normal_flow_nodes":[{"label":"N1 — Aisin Seiki Kariya Plant No.10","description":"Near-sole producer (~99%); remaining ~1% supplied by Nissin Kogyo Co. 32,500 units/day. Special-purpose machinery — destroyed in fire. 6,000+ molds destroyed."},{"label":"N2 — Raw material suppliers","description":"Steel, rubber, hydraulic components for P-valve production."},{"label":"N3 — 200+ Toyota-group suppliers (recovery)","description":"Toyota Tier-1/2 suppliers who volunteered or were asked to improvise P-valve production using adapted machinery."},{"label":"N4 — Toyota assembly plants (20 in Japan)","description":"All 20 Toyota assembly plants in Japan — dependent on daily JIT P-valve delivery with ~2–3 days of buffer."},{"label":"N5 — Downstream assembly (Hino, Daihatsu, Mitsubishi - Suzuki was not affected)","description":"Other Toyota-group manufacturers also using Aisin P-valves."},{"label":"N6 — Dealers / customers","description":"Global Toyota dealers and end customers awaiting vehicle delivery."},{"label":"N7 — Toyota Motor Corporation (coordinator)","description":"Toyota's crisis management team coordinated recovery — guaranteed to buy back surplus inventory; distributed 1% of Tier-1 sales as compensation."}],"normal_flow_steps":[{"step":1,"process":"Steel/rubber inputs sourced for P-valve production","node":"Raw materials → N1 Aisin"},{"step":2,"process":"P-valves machined to precision tolerances at Aisin Kariya Plant No.10 (32,500/day)","node":"N1 Aisin manufacturing"},{"step":3,"process":"JIT delivery of P-valves to Toyota assembly plants (daily; ~2–3 days buffer only)","node":"N1 → N4 Toyota plants"},{"step":4,"process":"Vehicles assembled; P-valve installed in braking system","node":"N4 Toyota assembly"},{"step":5,"process":"Finished vehicles distributed to dealers and customers","node":"N4 → N6 Dealers/customers"},{"step":6,"process":"RECOVERY: blueprints shared by fax; 200+ suppliers adapt their machines to produce P-valves","node":"N3 Supplier network (recovery)"},{"step":7,"process":"Toyota guarantees purchase of surplus; distributes 1% Tier-1 sales as compensation","node":"N7 Toyota (financial backstop)"},{"step":8,"process":null,"node":null},{"step":9,"process":null,"node":null},{"step":10,"process":null,"node":null}],"kpis":[{"label":"Cost","value":"Very High (short-term); offset by rapid recovery"},{"label":"Lead Time","value":"~2–3 days buffer → zero within hours of fire"},{"label":"CO₂ Impact","value":"Lower (fewer vehicles produced during shutdown)"},{"label":"Waste","value":"High (idle assembly lines; scrapped in-process vehicles)"},{"label":"Customer Satisfaction","value":"Reduced (delivery delays); recovered quickly"},{"label":"Risk","value":"Very High (realised) — sole-source, JIT, no contingency"},{"label":"Quality","value":"P-valve quality maintained during recovery (100% inspection)"},{"label":"Sustainability","value":"Minimal dedicated molds destroyed; broader environmental neutral"},{"label":"Circular Economy","value":"Low — not material to this case"}],"disruption":[{"label":"Trigger event","value":"1 February 1997 before dawn: fire breaks out at Aisin Seiki Factory No. 10, Kariya, Japan. Cause reportedly unknown. By 8:52 AM: P-valve production lines, clutch master cylinder lines, tandem master cylinder lines almost completely destroyed. 6,000+ molds lost. Special-purpose machinery destroyed (months to reorder). SOLE P-valve source = gone."},{"label":"Root cause details","value":"Fire physically destroyed the only production facility making P-valves for Toyota. Aisin was the SOLE SOURCE of P-valves for ALL Toyota vehicles. JIT left only ~2–3 days of buffer. No contingency plan existed. Single-sourcing under JIT = catastrophic vulnerability."},{"label":"Affected nodes","value":"~2–3 days of P-valve stock — compressed to hours by in-transit demand. Assembly lines would stop within days without intervention. All 20 Toyota assembly plants in Japan; Hino, Daihatsu, Mitsubishi, Suzuki also affected. ~70,000 vehicles at risk. ~$160M–$245M net 'unavoidable' loss (post-recoupment), vs. ~$1.3B (¥160B) gross revenue at risk before recoupment through overtime/extra shifts."},{"label":"Effect on Supply chain","value":"Near-total shutdown of the entire Toyota production network in Japan within days — averted only by unprecedented network self-organisation."}],"decision_blocks":[{"source":"Decision Analysis by the Company","decisions":[{"Decision No":"1","Description":"Activate crisis management team immediately","Action":"Mobilise response; share P-valve specs with all potential recovery suppliers","Cost":"Low (org)","Lead Time":"Immediate","CO2 Impact":"Low","Risk":"Reduced (activation speed)","Quality":"Enabled","Customer satisfaction":"Partial (immediate)","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"First response — always; speed of activation determines downstream options"},{"Decision No":2,"Description":"Share P-valve blueprints with 200+ suppliers (by fax)","Action":"Fax technical drawings to every supplier capable of potential P-valve production","Cost":"Very Low","Lead Time":"Immediate","CO2 Impact":"Low","Risk":"Reduced","Quality":"Enabled","Customer satisfaction":"High","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Critical path: without specs, no supplier can begin improvisation"},{"Decision No":3,"Description":"Guarantee buy-back of surplus inventory","Action":"Remove financial risk from suppliers improvising P-valve production","Cost":"Low-Med (liability)","Lead Time":"Immediate","CO2 Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Suppliers won't risk capital on improvised production without this guarantee"},{"Decision No":4,"Description":"Distribute 1% Tier-1 sales as compensation","Action":"Compensate suppliers for losses incurred during disruption","Cost":"Medium","Lead Time":"Post-crisis","CO2 Impact":"Neutral","Risk":"Reduced (long-term)","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Reinforces network trust for future crises; makes the relationship investment tangible"},{"Decision No":5,"Description":"Self-organised supplier improvisation (200+ firms)","Action":"Adapt existing machines; improvise P-valve production without central direction","Cost":"Medium (engineering effort)","Lead Time":"Days","CO2 Impact":"Med","Risk":"Reduced","Quality":"High","Customer satisfaction":"Partial→High","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Network trust + shared engineering knowledge makes this possible; impossible without them"},{"Decision No":6,"Description":"100% manual quality inspection of improvised parts","Action":"Inspect every P-valve before dispatch — no batch sampling","Cost":"Medium (labour)","Lead Time":"Continuous","CO2 Impact":"Low","Risk":"Reduced (quality risk)","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Safety-critical brake component — 100% inspection is non-negotiable"},{"Decision No":7,"Description":"Multi-source P-valve supply (post-crisis, long-term)","Action":"Qualify additional P-valve suppliers to end sole-source dependency","Cost":"Medium-High","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Reduced struct.","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"After sole-source vulnerability realised — structural fix to prevent recurrence"},{"Decision No":8,"Description":"Invest in supplier relationship depth (structural)","Action":"Deepen trust, shared standards and engineering knowledge across supplier network","Cost":"Medium (ongoing)","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Reduced struct.","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"The capability that enabled recovery must be cultivated continuously"}]},{"source":"Decision Analysis  (Self Analysis)","decisions":[{"Decision No":"1","Description":"Digital supplier network twin (instant alternate production finder)","Action":"Build a platform that maps every supplier's machine types and available capacity; shows alternate P-valve producers in hours not days","Cost":"High","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"Immediately after the 1997 recovery; fax coordination took days — a digital twin compresses this to hours"},{"Decision No":2,"Description":"Shared CAD/blueprint cloud platform for crisis production","Action":"Store critical part blueprints on a secure cloud accessible to all qualified suppliers; eliminate fax-delay in crisis","Cost":"Medium","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"After proving that blueprint sharing is the rate-limiting step in crisis recovery; cloud beats fax by days"},{"Decision No":3,"Description":"Pre-signed mutual-aid agreements with top 50 suppliers","Action":"Formalise the 1997 self-organisation in advance: suppliers pre-agree to share capacity, machines and workers in a declared emergency","Cost":"Low","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"After proving that trust enables recovery; pre-signed agreements reduce the initiation delay from hours to minutes"},{"Decision No":4,"Description":"3D printing as emergency bridge production","Action":"Qualify 3D-printed P-valves as a bridge supply (for lower-stress applications) while main production recovers","Cost":"Medium","Lead Time":"Fast","CO2 Impact":"Low","Risk":"Reduced","Quality":"Medium-High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"When conventional tooling destruction is total and 3D printing can cover partial output while tooling is rebuilt"},{"Decision No":5,"Description":"Distributed buffer stock programme for sole-sourced parts","Action":"Hold a rolling 2-week buffer of every part with only one qualified supplier, distributed across multiple warehouses","Cost":"Medium","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"For all sole-sourced safety-critical components; the 2–3 day JIT buffer was the core structural vulnerability"},{"Decision No":6,"Description":"Supplier financial resilience scoring","Action":"Monitor supplier financial health quarterly; flag at-risk suppliers before financial stress causes supply disruption","Cost":"Low-Med","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"After sole-source fire risk is addressed; financial failure is the second most likely single-source disruption"},{"Decision No":7,"Description":"IoT machine-capacity monitoring across the supplier network","Action":"Deploy IoT sensors on critical machines at top 20 suppliers to monitor real-time capacity, downtime and throughput","Cost":"High","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"When manual capacity discovery (phone calls) is the slowest part of crisis response — real-time visibility eliminates it"}]}],"decisions_impact_summary":[{
