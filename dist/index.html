ular Economy":"Neutral"},{"label":"Shared CAD cloud platform","Cost":"Medium","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"Pre-signed mutual-aid agreements","Cost":"Low","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"Struct. Reduced","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"3D printing bridge production","Cost":"Medium","Lead Time":"Fast","CO₂ Impact":"Low","Risk":"Reduced","Quality":"Med-High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"Distributed buffer stock","Cost":"Medium","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"Struct. Reduced","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"Supplier financial scoring","Cost":"Low-Med","Lead Time":"Medium","CO₂ Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"},{"label":"IoT capacity monitoring","Cost":"High","Lead Time":"Long","CO₂ Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer Satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral"}],"kpi_change_summary":[{"label":"Normal (pre-fire)","P-valve output":"32,500/day (sole source)","Buffer stock":"~2–3 days","Plants running":"All 20 running","Vehicles/day":"Normal rate","Network activation":"Not needed","Recovery time":"n/a","Risk":"High (unrecog.)","Trust capital":"High (built over years)"},{"label":"Disruption (day 1)","P-valve output":"Zero","Buffer stock":"~2–3 days (countdown)","Plants running":"All 20 halting","Vehicles/day":"Zero","Network activation":"Activated","Recovery time":"Days (unknown)","Risk":"Realised","Trust capital":"High (now deployed)"},{"label":"Recovery (days 2–5)","P-valve output":"0 → 32,500/day (improvised)","Buffer stock":"Depleting → restoring","Plants running":"Partial → Full","Vehicles/day":"Recovering","Network activation":"200+ firms active","Recovery time":"~5 days total","Risk":"Managed","Trust capital":"High (demonstrated)"},{"label":"Post-crisis (structural)","P-valve output":"32,500/day (multi-sourced)","Buffer stock":"Higher buffers","Plants running":"Full","Vehicles/day":"Normal","Network activation":"Ready","Recovery time":"<2 days (target)","Risk":"Lower (structural)","Trust capital":"High + deepened"}],"decision_scores":[{"label":"D2 Share blueprints immediately","Cost":5,"Resilience Gain":5,"Feasibility":5,"Speed":5,"Sustainability":3,"Overall":4.6,"_overall_calculated":true},{"label":"D3 Buy-back guarantee","Cost":4,"Resilience Gain":5,"Feasibility":5,"Speed":5,"Sustainability":3,"Overall":4.4,"_overall_calculated":true},{"label":"D5 Supplier improvisation network","Cost":3,"Resilience Gain":5,"Feasibility":4,"Speed":4,"Sustainability":3,"Overall":3.8,"_overall_calculated":true},{"label":"D6 100% quality inspection","Cost":3,"Resilience Gain":5,"Feasibility":4,"Speed":3,"Sustainability":3,"Overall":3.6,"_overall_calculated":true},{"label":"D1 Activate crisis team","Cost":5,"Resilience Gain":4,"Feasibility":5,"Speed":5,"Sustainability":3,"Overall":4.4,"_overall_calculated":true},{"label":"D7 Multi-source P-valve (LT)","Cost":3,"Resilience Gain":5,"Feasibility":3,"Speed":2,"Sustainability":3,"Overall":3.2,"_overall_calculated":true},{"label":"D8 Supplier relationship investment","Cost":3,"Resilience Gain":5,"Feasibility":3,"Speed":2,"Sustainability":4,"Overall":3.4,"_overall_calculated":true},{"label":"D4 1% Tier-1 compensation","Cost":3,"Resilience Gain":4,"Feasibility":4,"Speed":3,"Sustainability":4,"Overall":3.6,"_overall_calculated":true}],"sources":["Nishiguchi, T. & Beaudet, A. (1998). The Toyota Group and the Aisin Fire. MIT Sloan Management Review, 40(1), 49–59. PRIMARY ACADEMIC ANCHOR. https://shop.sloanreview.mit.edu/store/the-toyota-group-and-the-aisin-fire","Academia.edu PDF — The Toyota group and the Aisin fire (full paper): https://www.academia.edu/784006/The_Toyota_group_and_the_Aisin_fire","Wikipedia — 1997 Aisin fire (timeline; Factory No.10; P-valve function): https://en.wikipedia.org/wiki/1997_Aisin_fire","LinkedIn/Mansuri — People & Partners: Case of 1997 Aisin Fire (practitioner; recovery detail; 6,000 molds): https://www.linkedin.com/pulse/people-partners-case-1997-aisin-fire-toyota-system-mansuri","NECSI — Information Flow Structure in Large-Scale Product Development Networks (32,500/day; 5-day recovery): https://necsi.edu/information-flow-structure-in-largescale-product-development-organizational-networks","Reitman, V. (1997, May 8). \\"Toyota Motor Shows Its Mettle After Fire Destroys Parts Plant.\\" Wall Street Journal, p. A1."],"_sheet_name":"FIB-009"},{"id":"FIB-010","name":"Cisco Systems — $2.25B inventory write-down (2001): demand-signal distortion and the bullwhip effect","industry":"Electronics / Networking Equipment / Technology","brand_group":"Cisco Systems manufactures networking infrastructure (routers, switches, optical equipment). In the late 1990s it was the fastest-growing company in American corporate history. At its March 2000 peak, Cisco briefly became the most valuable company in the world (~$550B market cap).","scale":"$2.25B inventory write-down; $2.69B quarterly loss (first loss in 11+ years); 8,000+ jobs cut; stock fell from $82 to $13. CEO John Chambers called it a '100-year flood.'","normal_flow_nodes":[{"label":"N1 — End customers (telecoms/dot-coms)","description":"Telecom companies and dot-com startups. Placed inflated, double, and speculative orders due to shortage gaming and unlimited VC cash."},{"label":"N2 — Cisco Systems (OEM)","description":"Receives customer orders; aggregates and plans production; places orders to contract manufacturers."},{"label":"N3 — Contract manufacturers (global)","description":"Outsourced manufacturers building Cisco networking equipment globally. Each operated independently on their own local forecast."},{"label":"N4 — Component suppliers (chips, boards, optical)","description":"Tier-2/3 suppliers producing custom chips, circuit boards, optical components — many custom-built for Cisco-specific products."},{"label":"N5 — Raw material suppliers","description":"Upstream materials (metals, silicon, fibre-optic glass)."},{"label":"N6 — Cisco warehouses / inventory","description":"$2.25B of custom inventory accumulated — much of it scrapped and destroyed because it had no resale value."}],"normal_flow_steps":[{"step":1,"process":"Dot-com / telecom customers place inflated/double/speculative orders (shortage gaming)","node":"N1 Customers → N2 Cisco"},{"step":2,"process":"Cisco aggregates orders; treats all as real demand; places amplified orders to contract manufacturers","node":"N2 Cisco → N3 Contract mfrs"},{"step":3,"process":"Contract manufacturers order components independently, each adding their own buffer","node":"N3 → N4 Component suppliers"},{"step":4,"process":"Custom chips, boards, optical components produced to Cisco specs — not resaleable","node":"N4 Component suppliers → N3/N2"},{"step":5,"process":"Dot-com bubble bursts (2000–2001); customer orders evaporate overnight","node":"N1 Customers → Zero"},{"step":6,"process":"Cisco discovers $2.25B of custom inventory with no customer; write-down; destroy most of it","node":"N2/N6 Cisco — catastrophe"},{"step":7,"process":"POST-CRISIS: e-hub built; all tiers see real demand simultaneously; bullwhip eliminated","node":"All nodes — shared visibility"},{"step":8,"process":null,"node":null},{"step":9,"process":null,"node":null},{"step":10,"process":null,"node":null}],"kpis":[{"label":"Cost","value":"Very High ($2.25B write-down + $2.69B quarterly loss)"},{"label":"Lead Time","value":"Long (months advance orders due to component lead times) — amplified bullwhip"},{"label":"CO₂ Impact","value":"High (massive manufacturing + scrapping/destruction of inventory)"},{"label":"Waste","value":"Catastrophic — $2.25B of custom inventory scrapped and destroyed"},{"label":"Customer Satisfaction","value":"Low during shortage; collapsed with customer companies"},{"label":"Risk","value":"Very High (realised) — demand-signal blindness + outsourced mfg + custom parts = maximum bullwhip exposure"},{"label":"Quality","value":"Not impacted — the product was fine; the demand disappeared"},{"label":"Sustainability","value":"Very High negative — mass destruction of manufactured goods"},{"label":"Circular Economy","value":"Low — most inventory was scrapped/destroyed, though some non-custom/raw materials were reportedly sold to recyclers/salvage brokers"}],"disruption":[{"label":"Trigger event","value":"Dot-com bubble collapse, 2000–2001: telecom and dot-com customers — Cisco's entire customer base — simultaneously stopped spending. Orders placed under speculative/double-ordering conditions were cancelled en masse."},{"label":"Root cause details","value":"Bullwhip-effect theory (Lee et al. 1997) identifies these three mechanisms generally; their specific occurrence in Cisco's 2000–2001 order book is inferred from the outcome, not independently documented in available sources - Demand evaporated almost overnight as the dot-com bubble burst. Cisco was holding $2.25B of custom inventory it had built against inflated demand signals. Three mechanisms simultaneously inflated demand signals: (1) Shortage gaming — customers over-ordered to receive less than they requested; (2) Double-ordering — customers ordered from multiple vendors for the same equipment; (3) Speculative ordering — VC-funded companies ordered far ahead of actual need. Cisco had no system to detect or correct for any of these. Each supply chain tier amplified the inflated signal further. The components Cisco ordered were custom-built to Cisco-specific designs. When demand disappeared, the inventory could not be redirected or sold to other customers. Most was literally scrapped and destroyed."},{"label":"Affected nodes","value":"Cisco's own ERP was blind to upstream production. It saw orders coming in (inflated) and warehouse stock (finite). It did not see the $2.25B being built in contract manufacturer pipelines against those inflated orders."},{"label":"Effect on Supply chain","value":"$2.2B per Cisco's SEC filing (commonly rounded to $2.25B in secondary sources); $2.69B quarterly loss; 8,000 jobs; stock $82→$13; reputational damage; foundational industry lesson in demand-visibility failure."}],"decision_blocks":[{"source":"Decision Analysis by the Company","decisions":[{"Decision No":"1","Description":"Accept 'uncontrollable forces' narrative","Action":"Attribute the disaster to the dot-com crash as unforeseeable — 'a 100-year flood'","Cost":"Low","Lead Time":"n/a","CO2 Impact":"Neutral","Risk":"n/a","Quality":"n/a","Customer satisfaction":"n/a","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Never — a '100-year flood' framing closes off the structural lessons. The bullwhip conditions were visible and preventable."},{"Decision No":2,"Description":"Halt production when demand signals weakened","Action":"Stop contract manufacturers the moment demand anomalies appeared","Cost":"Low","Lead Time":"Fast (if acted)","CO2 Impact":"Low","Risk":"Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Requires real-time demand visibility — impossible without the e-hub. Highlights why D6 is the true structural fix."},{"Decision No":3,"Description":"Emergency inventory write-down","Action":"Acknowledge and write off $2.25B of stranded inventory","Cost":"High (financial)","Lead Time":"Immediate","CO2 Impact":"High","Risk":"Managed","Quality":"Restored","Customer satisfaction":"Partially","Sustainability":"Neutral","Circular Economy":"Negative","Best when":"When inventory is worthless and delay only defers the inevitable — fast acknowledgement limits reputational damage."},{"Decision No":4,"Description":"Cut 8,000+ jobs","Action":"Reduce workforce to match dramatically lower demand","Cost":"High (human)","Lead Time":"Fast","CO2 Impact":"Neutral","Risk":"Reduced cost","Quality":"Reduced","Customer satisfaction":"Low (short-term)","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"Unavoidable once demand collapsed — but the structural prevention (D6) would have made the scale of cuts smaller."},{"Decision No":5,"Description":"Demand signal verification / anti-gaming protocols","Action":"Identify double-ordering and shortage gaming; require firmer demand commitments","Cost":"Low-Med","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"After bullwhip dynamics identified — addresses the customer-side cause of signal inflation."},{"Decision No":6,"Description":"Build the e-hub (shared demand platform)","Action":"Give all supply-chain tiers a common, real-time demand/inventory view simultaneously","Cost":"Medium (platform)","Lead Time":"Long (build)","CO2 Impact":"Low","Risk":"Reduced struct.","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"After multi-tier signal distortion proven — the structural cure to the bullwhip, not a symptom treatment."},{"Decision No":7,"Description":"Adopt CPFR with contract manufacturers","Action":"Collaborative Planning, Forecasting and Replenishment — share real demand data, not forecasts","Cost":"Low-Med","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Reduced struct.","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"After bullwhip shown to result from independent, non-shared forecasting at each tier."},{"Decision No":7,"Description":"Require demand signals from further up the VALUE CHAIN","Action":"Monitor end-customer consumption (not just orders) as the true demand signal","Cost":"Low-Med","Lead Time":"Medium","CO2 Impact":"Low","Risk":"Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"n/a","Best when":"The real demand signal is what end customers consume, not what intermediate customers order."},{"Decision No":"Decision No","Description":"Description","Action":"Action","Cost":"Cost","Lead Time":"Lead Time","CO2 Impact":"CO2 Impact","Risk":"Risk","Quality":"Quality","Customer satisfaction":"Customer satisfaction","Sustainability":"Sustainability","Circular Economy":"Circular Economy","Best when":"Best when"},{"Decision No":"1","Description":"AI demand-signal deduplication (detect double-ordering in real time)","Action":"Build an ML system that cross-references orders across all channels to flag when the same end-customer is double-ordering","Cost":"Medium","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"As soon as order volumes enable pattern detection; the double-ordering mechanism was visible in the data"},{"Decision No":2,"Description":"Customer financial health monitoring (flag order risk early)","Action":"Monitor credit ratings, VC funding rounds and revenue signals of Cisco's top 100 customers to flag demand risk 60–90 days early","Cost":"Low-Med","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"When customer base consists of VC-funded startups and telecom companies with highly volatile spending"},{"Decision No":3,"Description":"Modular product design to reduce custom-only inventory","Action":"Design products with standardised subassemblies that can be configured at final assembly, reducing the custom-inventory write-down risk","Cost":"High","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"At product design stage; the $2.25B write-down was catastrophic because custom parts had zero resale value"},{"Decision No":4,"Description":"Dynamic contract flexibility clauses","Action":"Include demand-collapse exit clauses in all manufacturing contracts allowing production halt within 2 weeks on verified demand signal collapse","Cost":"Low","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"Before the next major technology boom-bust cycle; fast production halt capability is the operational cure"},{"Decision No":5,"Description":"Real-time end-consumption visibility (not just orders)","Action":"Connect directly to telco and ISP network utilisation data — actual traffic growth — as the true demand signal, not customer order books","Cost":"High","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"When customer orders are a lagging and distorted proxy for real end-market demand"},{"Decision No":6,"Description":"Tiered inventory commitment system","Action":"Implement a staged commitment model: 30% firm, 30% soft, 40% option-only — reducing hard inventory commitment to verified demand","Cost":"Low-Med","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"When demand uncertainty is high; options cost less than write-downs and preserve supplier relationships"},{"Decision No":7,"Description":"Supply chain digital twin stress-testing","Action":"Run monthly demand-collapse scenarios on a supply-chain digital twin to identify inventory accumulation risk before it materialises","Cost":"Medium","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"Before a demand peak; monthly stress-testing would have flagged $2.25B of accumulation risk in Q3 2000"}]},{"source":"Decision Analysis  (Self Analysis)","decisions":[{"Decision No":"1","Description":"AI demand-signal deduplication (detect double-ordering in real time)","Action":"Build an ML system that cross-references orders across all channels to flag when the same end-customer is double-ordering","Cost":"Medium","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"As soon as order volumes enable pattern detection; the double-ordering mechanism was visible in the data"},{"Decision No":2,"Description":"Customer financial health monitoring (flag order risk early)","Action":"Monitor credit ratings, VC funding rounds and revenue signals of Cisco's top 100 customers to flag demand risk 60–90 days early","Cost":"Low-Med","Lead Time":"Medium","CO2 Impact":"Neutral","Risk":"Reduced","Quality":"High","Customer satisfaction":"Protected","Sustainability":"Neutral","Circular Economy":"Neutral","Best when":"When customer base consists of VC-funded startups and telecom companies with highly volatile spending"},{"Decision No":3,"Description":"Modular product design to reduce custom-only inventory","Action":"Design products with standardised subassemblies that can be configured at final assembly, reducing the custom-inventory write-down risk","Cost":"High","Lead Time":"Long","CO2 Impact":"Neutral","Risk":"Structurally Reduced","Quality":"High","Customer satisfaction":"Pro
